<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Responsive Image Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="gallery-header">
    <p class="tagline">Explore Nature</p>
    <h1>Photo Gallery</h1>
    <p class="subtitle">A responsive 3-column CSS Grid gallery that adapts smoothly to mobile screens.</p>
  </header>

  <main class="gallery-container">
    <div class="gallery-grid">
      
      <!-- Gallery Item 1 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=800&q=80" 
          alt="Misty mountain landscape reflected in a calm lake" 
          loading="lazy"
        >
        <figcaption class="overlay">
          <h3>Alpine Reflections</h3>
          <p>Yosemite National Park</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 2 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1511497584788-87676104235f?auto=format&fit=crop&w=800&q=80" 
          alt="Sunlight piercing through dense evergreen forest trees" 
          loading="lazy"
        >
        <figcaption class="overlay">
          <h3>Morning Mist</h3>
          <p>Black Forest, Germany</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 3 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?auto=format&fit=crop&w=800&q=80" 
          alt="Rolling fog blankets lush green hills during sunrise" 
          loading="lazy"
        >
        <figcaption class="overlay">
          <h3>Golden Solitude</h3>
          <p>Tuscany Valleys</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 4 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=800&q=80" 
          alt="Vast green meadow beneath a sunset sky" 
          loading="lazy"
        >
        <figcaption class="overlay">
          <h3>Endless Meadows</h3>
          <p>Southern Highlands</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 5 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" 
          alt="Turquoise ocean waves crashing on soft white sand" 
          loading="lazy"
        >
        <figcaption class="overlay">
          <h3>Coastal Serenity</h3>
          <p>Maldives Shoreline</p>
        </figcaption>
      </figure>

      <!-- Gallery Item 6 -->
      <figure class="gallery-item">
        <img 
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=800&q=80" 
          alt="Towering snow-capped mountain peaks touching dramatic clouds" 
          loading="lazy"
        >
        <figcaption class="overlay">
          <h3>Granite Peaks</h3>
          <p>Swiss Alps</p>
        </figcaption>
      </figure>

    </div>
  </main>

</body>
</html>
